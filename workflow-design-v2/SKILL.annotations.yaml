init_user_intent:
  type: FnNode
  id: init_user_intent
  command: python3 -c "from factory.workflow.contributed.design_v2.intent_init import
    main; main()" "{project_path}"
  reads: []
  writes:
  - .factory/strategy/user-intent.md
  edges_out:
  - target: gate_has_factory
    condition: null
gate_has_factory:
  type: GateNode
  id: gate_has_factory
  evaluator_type: fn
  evaluator_command: python3 -c "from pathlib import Path; exists = Path("{project_path}/.factory/config.json").exists();
    print("PROCEED" if exists else "HALT")"
  reads: []
  edges_out:
  - target: graph_update
    condition: PROCEED
  - target: discover
    condition: HALT
discover:
  type: FnNode
  id: discover
  command: factory discover {project_path}
  reads: []
  writes:
  - .factory/eval_profile.json
  edges_out:
  - target: gate_factory_md_exists
    condition: null
gate_factory_md_exists:
  type: GateNode
  id: gate_factory_md_exists
  evaluator_type: fn
  evaluator_command: python3 -c "from pathlib import Path; exists = Path("{project_path}/factory.md").exists();
    print("PROCEED" if exists else "HALT")"
  reads: []
  edges_out:
  - target: factory_init
    condition: PROCEED
  - target: create_factory_md
    condition: HALT
create_factory_md:
  type: AgentNode
  id: create_factory_md
  role: ceo
  blocking: 'true'
  reads:
  - .factory/eval_profile.json
  writes:
  - factory.md
  edges_out:
  - target: factory_init
    condition: null
  slots:
    task_prompt_create_factory_md: 'Create factory.md from template. Copy the factory
      config template to the project root. Fill in: Goal, Scope, Guards, Eval command,
      Threshold, and Smoke Test. If .factory/eval_spec.json exists, populate the Eval
      Spec section. If .factory/strategy/current.md has a Research Configuration section,
      populate research sections (Research Target, Mutable/Fixed Surfaces, etc.).

      Read: .factory/eval_profile.json

      Write output to: factory.md'
    timeout_create_factory_md: '3600'
factory_init:
  type: FnNode
  id: factory_init
  command: factory init {project_path}
  reads:
  - factory.md
  writes:
  - .factory/config.json
  edges_out:
  - target: graph_update
    condition: null
graph_update:
  type: FnNode
  id: graph_update
  command: factory graph update {project_path}
  reads: []
  writes:
  - graph.json
  edges_out:
  - target: study
    condition: null
study:
  type: Study
  id: study
  command: factory study {project_path}
  writes:
  - .factory/strategy/observations.md
  edges_out:
  - target: graph_explorer
    condition: null
graph_explorer:
  type: AgentNode
  id: graph_explorer
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/graph-context.md
  edges_out:
  - target: concat_study
    condition: null
  slots:
    task_prompt_graph_explorer: 'Explore the project''s code knowledge graph to build
      structural understanding. Read .factory/strategy/observations.md for focus context.


      **Step 0 — detect graph availability:** Your working directory is already the
      project root. The graph file lives at `$PROJECT_PATH/graph.json` (NOT inside
      `.factory/`). Run this smoke check FIRST — use a relative path since your CWD
      is the project root: `test -f graph.json && echo ''GRAPH AVAILABLE'' || echo
      ''NO GRAPH''` — if the output says GRAPH AVAILABLE, proceed with the graph commands
      below. If the output says NO GRAPH, skip to the fallback section.


      **If the graph IS available:**

      1. Run `factory graph query "$PROJECT_PATH" "<focus from observations>" --depth
      2` to find relevant nodes

      2. Run `factory graph explain "$PROJECT_PATH" "<key node>"` on the most important
      nodes to understand their connections and dependencies

      3. Run `factory graph path "$PROJECT_PATH" "<A>" "<B>"` to trace dependency
      paths between key components

      4. Write structured findings to .factory/strategy/graph-context.md covering:
      key modules and their relationships, dependency paths, architectural layers,
      entry points and hotspots


      **If the graph is NOT available**, fall back to direct file exploration:

      1. Use `find . -name ''*.py'' | head -50` to discover source files

      2. Use `grep -rn ''class \|def '' --include=''*.py'' | head -100` to map functions
      and classes

      3. Use `grep -rn ''import '' --include=''*.py'' | head -100` to trace dependencies

      4. Write the same structured findings to .factory/strategy/graph-context.md

      Read: .factory/strategy/observations.md

      Write output to: .factory/strategy/graph-context.md'
    timeout_graph_explorer: '600'
concat_study:
  type: FnNode
  id: concat_study
  command: cat {project_path}/.factory/strategy/observations.md {project_path}/.factory/strategy/graph-context.md
    > {project_path}/.factory/strategy/study-combined.md
  reads:
  - .factory/strategy/graph-context.md
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/study-combined.md
  edges_out:
  - target: research_director
    condition: null
research_director:
  type: AgentNode
  id: research_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/strategy/study-combined.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/research-plan.json
  edges_out:
  - target: strategy_director
    condition: null
  slots:
    task_prompt_research_director: "You are the Research Director for this design\
      \ session.\n\nRead:\n- `.factory/strategy/study-combined.md` — project study\
      \ findings (observations + graph analysis)\n- `.factory/strategy/user-intent.md`\
      \ — the user's original idea\n\nYour task has TWO phases:\n\nPHASE 1 — DESIGN\
      \ RESEARCH DIRECTIONS\nAnalyze the design space and identify N orthogonal research\
      \ dimensions.\nDefault dimensions (adapt or replace based on the specific project):\n\
      \  - Similar projects / prior art\n  - Technology stack options\n  - Common\
      \ pitfalls and failure modes\nYou may add dimensions specific to the domain\
      \ (e.g., security, UX patterns,\ndata model constraints, compliance requirements,\
      \ API design, concurrency).\n\nN is NOT fixed — YOU decide based on domain complexity:\n\
      \  - Simple CLI or library: 3 directions\n  - Web app with auth, database, UI:\
      \ 4-5 directions\n  - Complex system with integrations, security, compliance:\
      \ 5-7 directions\n\nFor each direction, design a TAILORED prompt — not a generic\
      \ template.\nBad: \"Research similar projects and prior art\"\nGood: \"Find\
      \ existing link-checking tools that handle Obsidian-style wikilinks\n      \
      \ ([[note]]) and image embeds (![[image.png]]). Compare how they resolve\n \
      \      relative paths vs vault-root-relative paths.\"\n\nWrite the research\
      \ plan to `.factory/strategy/research-plan.json`:\n```json\n[\n  {\"focus\"\
      : \"...\", \"slug\": \"...\", \"prompt\": \"...\"}\n]\n```\n\nConstraints:\n\
      - Minimum 3 directions, maximum 7\n- Each slug must be unique and kebab-case\n\
      - Prompts must be specific to THIS project, not generic templates\n\nPHASE 2\
      \ — EXECUTE RESEARCH\nFor each direction in the plan, spawn a researcher agent:\n\
      ```\nfactory agent researcher --task \"<direction.prompt>\" --project $PROJECT_PATH\n\
      ```\n\nEach researcher writes to `.factory/strategy/research-<slug>.md`.\n\n\
      After ALL researchers complete, review quality:\n- Each research file exists\
      \ and has substantive content (>50 bytes)\n- No two reports cover the same ground\
      \ excessively\n- Key risks and opportunities are covered\n\nIf a researcher\
      \ produced thin output, re-invoke it with a more specific prompt.\n\nWrite a\
      \ brief research summary to the end of research-plan.json noting\nwhich directions\
      \ completed and any quality issues.\nRead: .factory/strategy/study-combined.md,\
      \ .factory/strategy/user-intent.md\nWrite output to: .factory/strategy/research-plan.json"
    timeout_research_director: '3600'
strategy_director:
  type: AgentNode
  id: strategy_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/strategy/research-plan.json
  - .factory/strategy/study-combined.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/strategy-plan.json
  edges_out:
  - target: synthesize_strategy
    condition: null
  slots:
    task_prompt_strategy_director: "You are the Strategy Director for this design\
      \ session.\n\nRead:\n- ALL research reports at `.factory/strategy/research-*.md`\n\
      - `.factory/strategy/research-plan.json` — which research directions were explored\n\
      - `.factory/strategy/user-intent.md` — the user's original idea\n- `.factory/strategy/study-combined.md`\
      \ — project context\n\nYour task has TWO phases:\n\nPHASE 1 — DESIGN STRATEGY\
      \ PERSPECTIVES\nAnalyze the research findings and user intent to identify M\
      \ strategy\nperspectives this project needs.\n\nDefault perspectives (adapt\
      \ or replace based on the specific project):\n  - Architecture strategy — how\
      \ to build it (components, phases, tech choices)\n  - Testing/verification strategy\
      \ — how to verify it works (acceptance criteria,\n    test plan, edge cases)\n\
      \  - Risk/scope strategy — what to cut, what's hard, what breaks\n\nYou may\
      \ add perspectives specific to the domain:\n  - Security strategy (for auth-heavy\
      \ projects)\n  - Data modeling strategy (for data-heavy projects)\n  - API design\
      \ strategy (for API-first projects)\n  - Performance strategy (for latency-sensitive\
      \ systems)\n\nM is NOT fixed — YOU decide based on project complexity:\n  -\
      \ Simple project: 2-3 perspectives\n  - Medium project: 3-4 perspectives\n \
      \ - Complex project: 4-5 perspectives\n\nFor each perspective, design a TAILORED\
      \ prompt.\nBad: \"Create an architecture strategy\"\nGood: \"Design the architecture\
      \ for a markdown link checker CLI. The core\n       challenge is resolving Obsidian\
      \ wikilinks against a configurable vault\n       root while also supporting\
      \ standard URLs with redirect following.\n       Research shows <X library>\
      \ handles HTTP well but nothing handles\n       wikilinks — design that component\
      \ from scratch.\"\n\nWrite the strategy plan to `.factory/strategy/strategy-plan.json`:\n\
      ```json\n[\n  {\"perspective\": \"...\", \"slug\": \"...\", \"prompt\": \"...\"\
      }\n]\n```\n\nConstraints:\n- Minimum 2 perspectives, maximum 5\n- Each slug\
      \ must be unique and kebab-case\n- One perspective MUST cover testing/verification\
      \ with explicit acceptance criteria\n- Prompts must reference specific findings\
      \ from the research reports\n\nINTENT FIDELITY CHECK (MANDATORY before spawning\
      \ strategists):\nBefore writing the strategy plan, extract every distinct ask\
      \ from\nuser-intent.md — features, constraints, behaviors, requirements the\
      \ user\nmentioned. Write them as an `\"intent_items\"` array in strategy-plan.json.\n\
      Then verify: does at least one perspective's prompt cover each intent item?\n\
      If an intent item is not addressed by any perspective, either add a\nperspective\
      \ or expand an existing prompt to cover it. No user ask may be\nsilently dropped.\n\
      \nEach strategist prompt MUST include this line at the end:\n\"IMPORTANT: The\
      \ user specifically asked for: <list the intent items relevant\nto this perspective>.\
      \ Your strategy MUST address each of these. Do not\nsubstitute your own ideas\
      \ for what the user asked for.\"\n\nPHASE 2 — EXECUTE STRATEGIES\nFor each perspective\
      \ in the plan, spawn a strategist agent:\n```\nfactory agent strategist --task\
      \ \"<perspective.prompt>\" --project $PROJECT_PATH\n```\n\nEach strategist writes\
      \ to `.factory/strategy/strategy-<slug>.md`.\n\nAfter ALL strategists complete,\
      \ review quality:\n- Each strategy file exists and has substantive content (>100\
      \ bytes)\n- The testing strategy has a `### Acceptance Criteria` section with\
      \ checkboxes\n- Architecture strategy cites research findings\n- No critical\
      \ perspective is missing\n- INTENT COVERAGE: re-read user-intent.md and verify\
      \ every user ask appears\n  in at least one strategy output. If a strategist\
      \ dropped an intent item,\n  re-invoke it with explicit instructions to address\
      \ the missing item.\n\nIf a strategist produced thin output, re-invoke it with\
      \ a more specific prompt.\n\nWrite a brief strategy summary to the end of strategy-plan.json\
      \ noting\nwhich perspectives completed, intent coverage status, and any quality\
      \ issues.\nRead: .factory/strategy/research-plan.json, .factory/strategy/study-combined.md,\
      \ .factory/strategy/user-intent.md\nWrite output to: .factory/strategy/strategy-plan.json"
    timeout_strategy_director: '3600'
synthesize_strategy:
  type: AgentNode
  id: synthesize_strategy
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/strategy-plan.json
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: design_doc
    condition: null
  slots:
    task_prompt_synthesize_strategy: "You are the Strategy Synthesizer. Compile one\
      \ final plan from all\nstrategy inputs. Your primary obligation is FIDELITY\
      \ TO USER INTENT —\nthe plan must capture everything the user asked for.\n\n\
      Read:\n- `.factory/strategy/user-intent.md` — ground truth for user's ask (READ\
      \ THIS FIRST)\n- ALL strategy files at `.factory/strategy/strategy-*.md`\n-\
      \ `.factory/strategy/strategy-plan.json` — which perspectives were explored,\n\
      \  including the `intent_items` array listing every user ask\n\nSTEP 1 — INTENT\
      \ EXTRACTION\nBefore synthesizing, extract every distinct ask from user-intent.md\
      \ into a\nnumbered list. These are the user's requirements. Every single one\
      \ must\nappear in the final plan — either as a feature in the phased plan, an\n\
      acceptance criterion, or an explicitly deferred item with rationale.\n\nSTEP\
      \ 2 — SYNTHESIZE\nWrite the final plan to `.factory/strategy/current.md`.\n\n\
      Required sections (in this order):\n### Architecture\n  Merge from architecture\
      \ strategy. Include component list and interfaces.\n### Phased Plan\n  ####\
      \ Phase 1: <name>\n  - **What:** <specific changes from architecture strategy>\n\
      \  - **Why:** <rationale>\n  - **Acceptance criteria:** <from testing strategy\
      \ — inline the relevant criteria>\n  - **Risks:** <from risk strategy — inline\
      \ relevant risks>\n  #### Phase 2: <name>\n  ...\n### Acceptance Criteria\n\
      \  Full checklist from testing strategy. Each item must be:\n  - [ ] Specific\
      \ enough for pass/fail verification\n  - Traceable to user intent (cite which\
      \ part of user-intent.md)\n### MVP Scope\n  From risk strategy. In vs deferred.\n\
      ### Deferred Features\n  Items requiring human intervention or explicitly deferred.\n\
      \nSTEP 3 — INTENT COVERAGE AUDIT\nAfter writing current.md, go back to your\
      \ numbered intent list from Step 1.\nFor each user ask, verify it appears in\
      \ the plan:\n- In the phased plan as a deliverable, OR\n- In acceptance criteria\
      \ as a testable item, OR\n- In deferred features with a rationale for why it's\
      \ deferred\n\nWrite a `### Intent Coverage` section at the end of current.md:\n\
      | # | User Ask | Where in Plan | Status |\n|---|----------|--------------|--------|\n\
      | 1 | <ask> | Phase 1 / Criterion 3 / Deferred | Covered / Deferred |\n\nIf\
      \ ANY user ask has status \"Missing\" — you have failed. Go back and add it\n\
      to the appropriate section before finalizing. No user ask may be silently\n\
      dropped.\n\nCRITICAL: The ### Acceptance Criteria section is the contract between\n\
      the builder and QA. It flows to adversarial testers who verify each\ncriterion\
      \ independently. Make every item testable and unambiguous.\nRead: .factory/strategy/strategy-plan.json,\
      \ .factory/strategy/user-intent.md\nWrite output to: .factory/strategy/current.md"
    timeout_synthesize_strategy: '600'
design_doc:
  type: AgentNode
  id: design_doc
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: gate_strategy
    condition: null
  slots:
    task_prompt_design_doc: "You are a Technical Writer and Design Architect. Your\
      \ job: take the structured\nstrategy at `.factory/strategy/current.md` and rewrite\
      \ it as a proper\nDESIGN DOCUMENT — a document a human reviewer can read end-to-end\
      \ and\nunderstand exactly what is being built, why, and how.\n\nRead:\n- `.factory/strategy/current.md`\
      \ — the structured strategy (your raw input)\n- `.factory/strategy/user-intent.md`\
      \ — the user's original idea and feedback\n\nRewrite `.factory/strategy/current.md`\
      \ IN PLACE. Replace the compressed\nbullet points with a well-structured design\
      \ document.\n\nRequired sections (in this order):\n\n## What We're Building\n\
      \  Explain the project in 2-3 paragraphs of prose. What does it do?\n  Who is\
      \ it for? What problem does it solve? Reference the user's\n  original words\
      \ from user-intent.md.\n\n## Architecture\n  Describe the system architecture\
      \ in full sentences.\n  Include a text-based architecture diagram using box-drawing\
      \ characters:\n  ```\n  ┌──────────┐     ┌──────────┐     ┌──────────┐\n  │\
      \ Component│────▶│ Component│────▶│ Component│\n  └──────────┘     └──────────┘\
      \     └──────────┘\n  ```\n  Explain each component — what it does, why it exists,\
      \ how it connects.\n\n## How It Works\n  Walk through the user flow step by\
      \ step. For a CLI, show example\n  invocations and expected output. For a web\
      \ app, describe the user\n  journey screen by screen. For a library, show usage\
      \ examples.\n\n  This should read like a tutorial — someone unfamiliar with\
      \ the project\n  should be able to follow along.\n\n## Phased Plan\n  For each\
      \ phase, explain:\n  - What gets built in this phase and why this ordering\n\
      \  - What the user can do after this phase completes\n  - How to verify the\
      \ phase worked (concrete test commands or checks)\n\n  Use prose paragraphs,\
      \ not just bullet points. Each phase should\n  read as a self-contained \"chapter.\"\
      \n\n## Acceptance Criteria\n  Present the full checklist, but group criteria\
      \ by category and add\n  context for each. Explain WHY each criterion matters,\
      \ not just what it is.\n\n  Format: category heading, then checkbox items with\
      \ brief explanation.\n\n## MVP Scope\n  What's in, what's deferred, and why.\
      \ Explain the tradeoffs.\n\n## Deferred Features\n  Items deferred to future\
      \ phases, with brief rationale.\n\nCRITICAL RULES:\n- Write in full sentences\
      \ and paragraphs, NOT bullet points\n- The reader should understand the design\
      \ WITHOUT reading any other file\n- Include concrete examples (CLI invocations,\
      \ API calls, code snippets)\n- Architecture diagrams must use text/box-drawing\
      \ characters\n- Every technical choice must be explained — no unexplained jargon\n\
      - The document must be self-contained: a human reviewer reads ONLY this\n  file\
      \ and decides whether to approve the design\nRead: .factory/strategy/current.md,\
      \ .factory/strategy/user-intent.md\nWrite output to: .factory/strategy/current.md"
    timeout_design_doc: '600'
gate_strategy:
  type: GateNode
  id: gate_strategy
  evaluator_type: user
  reads:
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: archivist_plan
    condition: PROCEED
  - target: strategy_director
    condition: RELOOP
  slots:
    max_iterations_gate_strategy: '3'
archivist_plan:
  type: AgentNode
  id: archivist_plan
  role: archivist
  blocking: 'false'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/archive/plan.md
  edges_out:
  - target: builder
    condition: null
  slots:
    task_prompt_archivist_plan: 'Archive the approved research and strategy.

      Read: .factory/strategy/current.md

      Write output to: .factory/archive/plan.md'
    timeout_archivist_plan: '300'
builder:
  type: AgentNode
  id: builder
  role: builder
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: gate_build
    condition: null
  slots:
    task_prompt_builder: 'Implement the next phase from .factory/strategy/current.md.
      Read the CEO''s plan approval at .factory/reviews/ceo-verdict-strategist.md.
      Read CLAUDE.md and factory.md if they exist. Implement exactly what the current
      phase describes. Run tests. Commit changes and open a draft PR.

      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md'
    timeout_builder: '1200'
gate_build:
  type: GateNode
  id: gate_build
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: fork_qa
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_build: Read builder output. Check git log and diff. Does the
      work match the plan for this phase? If the Builder opened a PR, read it. REDIRECT
      if off-scope or missed key requirements.
    max_iterations_gate_build: '3'
fork_qa:
  type: ForkNode
  id: fork_qa
  targets: health_checker,code_reviewer,qa_director
  edges_out:
  - target: join_qa
    condition: null
health_checker:
  type: AgentNode
  id: health_checker
  role: health_checker
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/health-check.md
  edges_out: []
  slots:
    task_prompt_health_checker: 'Execute health_checker task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/health-check.md'
    timeout_health_checker: '600'
code_reviewer:
  type: AgentNode
  id: code_reviewer
  role: code_reviewer
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/code-review.md
  edges_out: []
  slots:
    task_prompt_code_reviewer: 'Execute code_reviewer task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/code-review.md'
    timeout_code_reviewer: '900'
qa_director:
  type: AgentNode
  id: qa_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/reviews/qa-plan.json
  edges_out: []
  slots:
    task_prompt_qa_director: "You are the QA Director for this design session.\n\n\
      Read:\n- `.factory/strategy/current.md` — the design document with acceptance\
      \ criteria\n- `.factory/strategy/user-intent.md` — what the user ACTUALLY asked\
      \ for\n- `.factory/reviews/builder-latest.md` — what the builder implemented\n\
      \nYour task has THREE phases:\n\nPHASE 1 — DESIGN QA APPROACHES\nAnalyze the\
      \ acceptance criteria, the user's intent, and the builder's\nimplementation\
      \ to identify K orthogonal testing approaches.\n\nDefault approaches (adapt\
      \ or replace based on the specific project):\n  - Happy path verification —\
      \ does each acceptance criterion pass with\n    normal, expected inputs?\n \
      \ - Edge case & boundary testing — empty inputs, large inputs, special\n   \
      \ characters, off-by-one, boundary conditions\n  - User intent verification\
      \ — does the output match what the user\n    ACTUALLY asked for (from user-intent.md),\
      \ not just the plan?\n\nYou may add approaches specific to the implementation:\n\
      \  - Security testing (for auth, file I/O, user-facing APIs)\n  - Integration\
      \ testing (for multi-component systems)\n  - Performance testing (for latency-sensitive\
      \ features)\n  - Error handling testing (for systems with many failure modes)\n\
      \  - Concurrency testing (for parallel/async systems)\n\nK is NOT fixed — YOU\
      \ decide based on the complexity of the acceptance\ncriteria and the nature\
      \ of the implementation:\n  - Simple implementation (3-5 criteria): 2 testers\n\
      \  - Medium implementation (5-10 criteria): 3 testers\n  - Complex implementation\
      \ (10+ criteria, security, integrations): 4-5 testers\nNote: the code review\
      \ runs separately as Phase 3 and does NOT count toward K.\n\nFor each approach,\
      \ design a TAILORED prompt — not a generic template.\nBad: \"Test the implementation\
      \ for edge cases\"\nGood: \"Test the Obsidian wikilink resolver with these edge\
      \ cases:\n       nested vault folders (vault/sub/note.md linking to ../other.md),\n\
      \       wikilinks with display text ([[note|display]]),\n       wikilinks to\
      \ non-existent files, wikilinks with anchor\n       fragments ([[note#heading]]),\
      \ and case-sensitivity mismatches.\"\n\nWrite the QA plan to `.factory/reviews/qa-plan.json`:\n\
      ```json\n[\n  {\"approach\": \"...\", \"slug\": \"...\", \"prompt\": \"...\"\
      }\n]\n```\n\nConstraints:\n- Minimum 2 approaches, maximum 5\n- Each slug must\
      \ be unique and kebab-case\n- ALL acceptance criteria from current.md must be\
      \ covered by at least\n  one tester's prompt\n- One approach MUST verify user\
      \ intent against user-intent.md\n- Prompts must reference specific acceptance\
      \ criteria and implementation details\n\nMANDATORY RUN-THE-CODE TESTERS (hardcoded\
      \ — always include these):\nIn addition to your K designed approaches, you MUST\
      \ always include these\ntwo hardcoded testers that ACTUALLY RUN the built code.\
      \ These are non-negotiable.\n\n1. slug: \"smoke-run\"\n   Prompt: \"You are\
      \ a smoke-test runner. Your ONLY job: actually run what was\n   built. Do NOT\
      \ just read the code or check tests pass — EXECUTE the\n   application. For\
      \ a CLI: run it with example inputs from the acceptance\n   criteria. For a\
      \ server: start it, hit it with curl/httpx, verify responses.\n   For a library:\
      \ import it and call the main functions. Show the exact\n   commands you ran\
      \ and the exact output you got. If it crashes, fails to\n   start, or produces\
      \ wrong output — that is your finding. Keep it fast and\n   simple: 2-3 runs\
      \ max, focusing on the golden path.\"\n\n2. slug: \"user-scenario\"\n   Prompt:\
      \ \"You are testing from the user's perspective. Read\n   .factory/strategy/user-intent.md\
      \ for what the user actually asked for.\n   Now USE the application exactly\
      \ as the user described they would use it.\n   If the user said 'build a CLI\
      \ that checks links' — run it on a real\n   markdown file with links. If the\
      \ user said 'handle wikilinks' — create\n   a test file with wikilinks and run\
      \ the tool on it. Show exactly what you\n   did and what happened. The user's\
      \ words are your test script.\"\n\nThese two testers run alongside your K designed\
      \ testers — they do NOT count\ntoward K. Total agents spawned = K (designed)\
      \ + 2 (hardcoded) + 1 (code review).\n\nPHASE 2 — EXECUTE QA (ALL IN PARALLEL)\n\
      Spawn ALL of the following in parallel — K designed testers + 2 hardcoded\n\
      run-the-code testers + 1 code reviewer:\n\nFor each adversarial approach in\
      \ the plan:\n```\nfactory agent adversarial_tester --review-tag <slug> --task\
      \ \"<approach.prompt>\" --project $PROJECT_PATH &\n```\n\nPlus the 2 mandatory\
      \ run-the-code testers (ALWAYS, non-negotiable):\n```\nfactory agent adversarial_tester\
      \ --review-tag smoke-run --task \"<smoke-run prompt from above>\" --project\
      \ $PROJECT_PATH &\nfactory agent adversarial_tester --review-tag user-scenario\
      \ --task \"<user-scenario prompt from above>\" --project $PROJECT_PATH &\n```\n\
      \nPlus one mandatory code review (always, regardless of K):\n```\nfactory agent\
      \ code_reviewer --task \"Review the code changes on this branch. Use /code-review\
      \ for a thorough review covering correctness bugs, security issues, edge cases,\
      \ missing tests, style, scope creep, and simplification opportunities. Focus\
      \ on the diff — what changed, not the entire codebase.\" --project $PROJECT_PATH\
      \ &\n```\n\nThen `wait` for all K+3 agents to complete.\n\nEach adversarial\
      \ tester writes to `.factory/reviews/adversarial-<slug>-latest.md`.\nThe code\
      \ reviewer writes to `.factory/reviews/code-review.md`.\n\nAfter ALL agents\
      \ complete, review quality:\n- Each adversarial report exists and has substantive\
      \ findings\n- All acceptance criteria are covered by at least one tester\n-\
      \ No tester missed its assigned focus area\n- Code review completed — if it\
      \ found critical or high-severity issues,\n  flag them in your QA summary as\
      \ blocking\n- Critical findings are actually reproducible (spot-check)\n\nIf\
      \ a tester produced thin output, re-invoke it with a more specific prompt.\n\
      \nEach tester should output: Acceptance Criteria Verification (PASS/FAIL per\n\
      criterion with evidence), Edge Case Findings (steps to reproduce, expected\n\
      vs actual), and User Intent Verification (does output match user's ask).\n\n\
      Write a brief QA summary to the end of qa-plan.json noting which\napproaches\
      \ completed, code review results, and any quality issues.\nRead: .factory/reviews/builder-latest.md,\
      \ .factory/strategy/current.md, .factory/strategy/user-intent.md\nWrite output\
      \ to: .factory/reviews/qa-plan.json"
    timeout_qa_director: '3600'
join_qa:
  type: JoinNode
  id: join_qa
  sources: health_checker,code_reviewer,qa_director
  reads:
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  - .factory/reviews/qa-plan.json
  writes: []
  edges_out:
  - target: synthesize_qa
    condition: null
synthesize_qa:
  type: FnNode
  id: synthesize_qa
  command: python3 -c "from factory.workflow.contributed.design_v2.qa_synthesis import
    main; main()" "{project_path}"
  reads:
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  writes:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: gate_qa
    condition: null
gate_qa:
  type: GateNode
  id: gate_qa
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/qa-synthesized.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: builder
    condition: RELOOP
  - target: overwatch
    condition: PROCEED
  slots:
    gate_prompt_gate_qa: "You are the CEO reviewing QA results. This is the final\
      \ gate before merge.\n\nRead:\n- `.factory/strategy/user-intent.md` — what the\
      \ user ACTUALLY asked for\n- `.factory/reviews/qa-synthesized.md` — merged QA\
      \ report (health check,\n  code review, and synthesized adversarial findings)\n\
      \nDecision framework:\n\nPROCEED if ALL of these hold:\n  1. All acceptance\
      \ criteria from current.md are verified PASS\n  2. Health check passes (tests\
      \ green, eval not regressed)\n  3. No blocking code review issues\n  4. No HIGH-confidence\
      \ adversarial findings that violate user intent\n\nRELOOP to builder (max 3\
      \ iterations) if ANY of these hold:\n  1. An acceptance criterion failed — cite\
      \ which one\n  2. Health check failed — cite which check\n  3. Blocking review\
      \ or HIGH adversarial findings\n\n  When relooping, provide feedback mapped\
      \ to SPECIFIC user requirements:\n  - \"User asked for X (user-intent.md), but\
      \ <finding from QA>\"\n  - \"Acceptance criterion '<criterion>' FAILED: <evidence>\"\
      \n\n  IMPORTANT: Append your reloop feedback to .factory/strategy/user-intent.md\n\
      \  under a new '## [timestamp] Reloop Feedback (Iteration N)' heading.\n\nHALT\
      \ if:\n  - 3 reloops exhausted without resolution\n  - Fundamental design flaw\
      \ that builder iterations cannot fix"
    max_iterations_gate_qa: '3'
overwatch:
  type: AgentNode
  id: overwatch
  role: ceo
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  - .factory/reviews/qa-synthesized.md
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/reviews/overwatch-latest.md
  edges_out:
  - target: gate_overwatch
    condition: null
  slots:
    task_prompt_overwatch: 'You are the Overwatch — the final verification agent before
      the PR is shown to the user. Your job is to verify that everything the user
      asked for was actually built and actually tested, with evidence.


      You are NOT another QA pass. The adversarial testers already checked the code.
      You check the COMPLETENESS and HONESTY of the entire pipeline''s output.


      Read:

      - .factory/strategy/user-intent.md — every ask the user made

      - .factory/strategy/current.md — the approved strategy with acceptance criteria

      - .factory/reviews/builder-latest.md — what the builder claims to have done

      - .factory/reviews/qa-synthesized.md — merged QA report

      - .factory/reviews/health-check.md — eval and test results

      - .factory/reviews/code-review.md — code review findings


      STEP 1 — INTENT CHECKLIST

      Extract every distinct user ask from user-intent.md. For each:

      - Is it in the implementation? (check source code, git diff)

      - Is there test evidence in the QA reports? (command + output, not just claims)

      - Was it actually run? (look for execution evidence — not just "tests pass")


      STEP 2 — EVIDENCE AUDIT

      Read each QA report. For every PASS claim, check:

      - Does it show the actual command that was run?

      - Does it show the actual output?

      - Or is it just "verified — PASS" with no evidence?

      Flag every unsupported claim.


      STEP 3 — SPOT CHECK (MANDATORY)

      Pick the 2-3 most critical acceptance criteria from current.md.

      Actually run them yourself:

      - Execute the code with the user''s example inputs

      - Start the server/CLI/tool and verify it works with a real request

      - Try one edge case the user specifically mentioned in their feedback

      Show your commands and their output as evidence.


      Common agent pitfalls to check for:

      - Feature was compiled/linted but never actually executed

      - Server code exists but was never started

      - Tests mock everything and never hit real code paths

      - User''s specific feedback from intent ledger was ignored

      - CLI was tested with --help but never with actual inputs

      - Error handling was claimed but no error case was actually triggered


      STEP 4 — REPORT

      Write a structured report to .factory/reviews/overwatch-latest.md:


      # Overwatch Verification Report


      ## Intent Coverage

      | # | User Ask | Built? | Tested? | Evidence? | Status |

      |---|----------|--------|---------|-----------|--------|


      ## Evidence Audit

      - Claims with evidence: N

      - Claims without evidence: M

      - [list unsupported claims]


      ## Spot Check Results

      ### Check 1: <criterion>

      - Command: <what you ran>

      - Output: <what happened>

      - Verdict: PASS/FAIL


      ## Verdict

      PASS — all user asks verified with evidence

      FAIL — [list what''s missing or unsupported]

      Read: .factory/reviews/builder-latest.md, .factory/reviews/code-review.md, .factory/reviews/health-check.md,
      .factory/reviews/qa-synthesized.md, .factory/strategy/current.md, .factory/strategy/user-intent.md

      Write output to: .factory/reviews/overwatch-latest.md'
    timeout_overwatch: '1800'
gate_overwatch:
  type: GateNode
  id: gate_overwatch
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/overwatch-latest.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: gate_doc_freshness
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_overwatch: 'You are the CEO reviewing the Overwatch verification
      report.


      Read:

      - .factory/reviews/overwatch-latest.md — the Overwatch''s findings

      - .factory/strategy/user-intent.md — what the user asked for


      The Overwatch has verified whether everything the user asked for was actually
      built and tested with evidence.


      PROCEED if:

      - All user asks in the Intent Coverage table show Status = Covered

      - No unsupported claims in the Evidence Audit

      - Spot checks all passed

      - The Overwatch verdict is PASS


      RELOOP to builder if:

      - Any user ask is missing or untested

      - There are unsupported QA claims (tests claimed to pass without evidence)

      - Spot checks failed

      - The Overwatch verdict is FAIL


      When relooping, include the specific Overwatch findings in your feedback:

      - Which user asks are missing

      - Which claims lack evidence

      - Which spot checks failed and what the output was


      The builder will fix the issues and the full QA + Overwatch pipeline will re-run.'
    max_iterations_gate_overwatch: '3'
gate_doc_freshness:
  type: GateNode
  id: gate_doc_freshness
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: gate_precheck
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_doc_freshness: Check the PR diff for documentation freshness.
      If public APIs, CLI commands, configuration options, or architecture were changed
      or added, corresponding documentation (README.md, CLAUDE.md, docstrings, --help
      text, or doc/ files) MUST be updated. PROCEED if docs are current or no doc-worthy
      changes exist. RELOOP to builder if documentation is stale — specify exactly
      which changes need doc updates.
    max_iterations_gate_doc_freshness: '3'
gate_precheck:
  type: GateNode
  id: gate_precheck
  evaluator_type: fn
  evaluator_command: factory precheck {project_path} --score-before 0 --score-after
    0
  reads:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: archivist_build
    condition: PROCEED
  - target: archivist_build
    condition: HALT
archivist_build:
  type: AgentNode
  id: archivist_build
  role: archivist
  blocking: 'false'
  reads:
  - .factory/reviews/qa-synthesized.md
  writes:
  - .factory/archive/build.md
  edges_out:
  - target: spec_generate
    condition: null
  slots:
    task_prompt_archivist_build: 'Archive the build phase results.

      Read: .factory/reviews/qa-synthesized.md

      Write output to: .factory/archive/build.md'
    timeout_archivist_build: '300'
spec_generate:
  type: FnNode
  id: spec_generate
  command: factory workflow run spec-generate {project_path}
  reads: []
  writes: []
  edges_out: []
