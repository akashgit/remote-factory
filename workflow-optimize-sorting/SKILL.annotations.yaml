run_benchmark_t2:
  type: FnNode
  id: run_benchmark_t2
  command: cat > /tmp/_run_benchmark.py << 'PYEOF'
  reads:
  - .factory/sorting/baseline.json
  writes:
  - .factory/sorting/benchmark-result.json
  edges_out:
  - target: gate_catastrophic_t2
    condition: null
builder_implement_alternative:
  type: AgentNode
  id: builder_implement_alternative
  role: builder
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: run_benchmark_t3
    condition: null
  slots:
    task_prompt_builder_implement_alternative: 'You are a Builder implementing an
      algorithmic change for spike sorting.


      ## Context

      - Speed is the optimization target. Accuracy is a hard floor.

      - Neuropixels-scale: 384+ channels, 30kHz, millions of samples, GPU-accelerated.

      - STRICT accuracy: 0.5% overall threshold, 5% per-unit drop maximum.

      - Read strategy at `.factory/strategy/current.md`.


      ## STRICT RULES

      - Consider per-unit impact — some unit types may be more sensitive.

      - Prefer incremental changes over wholesale replacements.

      - Run existing tests after implementation.


      ## Reloop Handling

      - If sent back from `gate_accuracy_t3`: overall accuracy dropped >0.5%. Investigate
      which part of the algorithm caused the regression.

      - If sent back from `gate_per_unit_accuracy`: specific units regressed >5%.
      The feedback will list which units. Adjust the algorithm to handle those unit
      types better, or add special-case handling.


      ## Your Task

      1. Implement the algorithmic change from the strategy

      2. Run existing tests to verify correctness

      3. Write summary to `.factory/reviews/builder-latest.md`


      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md

      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md'
    timeout_builder_implement_alternative: '3600'
gate_catastrophic_t1:
  type: GateNode
  id: gate_catastrophic_t1
  evaluator_type: fn
  evaluator_command: 'python3 -c "import json, os;p = ''{project_path}'';bl = json.load(open(os.path.join(p,
    ''.factory'', ''sorting'', ''baseline.json'')));br = json.load(open(os.path.join(p,
    ''.factory'', ''sorting'', ''benchmark-result.json'')));acc = br[''accuracy''];bl_mean
    = bl[''accuracy''][''mean''];threshold = bl_mean * 0.9;print(f''pass: acc={acc:.4f}
    >= catastrophic threshold={threshold:.4f}'' if acc >= threshold else f''fail:
    catastrophic drop acc={acc:.4f} < {threshold:.4f} (>{10}% below baseline={bl_mean:.4f})'')"'
  reads:
  - .factory/sorting/baseline.json
  - .factory/sorting/benchmark-result.json
  edges_out:
  - target: confirm_benchmark_t1
    condition: PROCEED
  - target: archive_result_t1
    condition: HALT
gate_catastrophic_t2:
  type: GateNode
  id: gate_catastrophic_t2
  evaluator_type: fn
  evaluator_command: 'python3 -c "import json, os;p = ''{project_path}'';bl = json.load(open(os.path.join(p,
    ''.factory'', ''sorting'', ''baseline.json'')));br = json.load(open(os.path.join(p,
    ''.factory'', ''sorting'', ''benchmark-result.json'')));acc = br[''accuracy''];bl_mean
    = bl[''accuracy''][''mean''];threshold = bl_mean * 0.9;print(f''pass: acc={acc:.4f}
    >= catastrophic threshold={threshold:.4f}'' if acc >= threshold else f''fail:
    catastrophic drop acc={acc:.4f} < {threshold:.4f} (>{10}% below baseline={bl_mean:.4f})'')"'
  reads:
  - .factory/sorting/baseline.json
  - .factory/sorting/benchmark-result.json
  edges_out:
  - target: confirm_benchmark_t2
    condition: PROCEED
  - target: archive_result_t2
    condition: HALT
run_benchmark_t3:
  type: FnNode
  id: run_benchmark_t3
  command: cat > /tmp/_run_benchmark.py << 'PYEOF'
