# Base sandbox policy for `factory contained --division local`.
#
# Why this file exists at all: `openshell sandbox create --policy` **replaces** the base image's
# default policy (/etc/openshell/policy.yaml) rather than merging with it. Passing a file that
# contains only the division's network rule collapses the sandbox — verified: with a
# network-only policy, `/usr`, `/sandbox`, and even `/dev/null` all become inaccessible and the
# shell cannot redirect. So the moment the division needs one rule, it needs a whole policy.
#
# This is deliberately *not* a copy of the community default. It carries the sections that policy
# requires (filesystem, landlock, process) plus only the egress the factory itself uses. The
# community file additionally allows Cursor, VS Code, Copilot and NVIDIA endpoints; the factory does
# not talk to any of them, and a policy is worth having only to the extent it is narrow.
#
# `inference.local` is absent on purpose. The gateway's privacy router terminates it before policy
# evaluation — verified by a real completion inside a sandbox whose policy did not mention it.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  claude_code:
    name: claude-code
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: full }
      - { host: statsig.anthropic.com, port: 443 }
      - { host: sentry.io, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
      - { host: platform.claude.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }

  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/gh }

  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
    binaries:
      - { path: /usr/bin/git }

  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: /usr/local/factory/.venv/bin/python }
      - { path: /usr/local/factory/.venv/bin/python3 }
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: /usr/local/bin/uv }
